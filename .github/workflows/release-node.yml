# Workflow for building and publishing Node.js bindings via napi-rs.
#
# This workflow is separate from the main release workflow because:
# 1. The node crate (sublime_node_tools) uses cdylib which is not supported on musl targets
# 2. The node crate is excluded from the Cargo workspace to avoid cargo-dist failures
# 3. Node bindings need to be built after the main crates are released to crates.io
#
# Trigger: Manual dispatch or when changes are pushed to packages/workspace-tools on main

name: Release Node.js Bindings (npm)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish to npm)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'packages/workspace-tools/**'
      - 'crates/node/**'
      - '.github/workflows/release-node.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  # First, update the node crate dependencies to match the latest released versions
  prepare:
    name: Prepare Node Crate
    runs-on: ubuntu-latest
    outputs:
      cli_version: ${{ steps.versions.outputs.cli_version }}
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest crate versions
        id: versions
        run: |
          # Get the latest version of sublime_cli_tools from crates.io
          CLI_VERSION=$(cargo search sublime_cli_tools --limit 1 | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          echo "cli_version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest CLI version: $CLI_VERSION"

      - name: Check if we should publish
        id: check
        run: |
          # Check if the node crate Cargo.toml has the correct CLI version
          CURRENT_CLI_DEP=$(grep 'sublime_cli_tools' crates/node/Cargo.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Current CLI dependency in node crate: $CURRENT_CLI_DEP"
          echo "Latest CLI version: ${{ steps.versions.outputs.cli_version }}"

          if [ "$CURRENT_CLI_DEP" != "${{ steps.versions.outputs.cli_version }}" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version mismatch - need to update and publish"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Versions match - proceeding with build"
          fi

  build:
    name: Build - ${{ matrix.settings.target }}
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build-binding --target aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: pnpm build-binding --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build-binding --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build-binding --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build-binding --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm build-binding --target aarch64-unknown-linux-musl -x
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build-binding --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build-binding --target aarch64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Install ziglang (Linux musl cross-compile)
        if: ${{ contains(matrix.settings.target, 'musl') }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0

      - name: Update node crate CLI dependency version
        shell: bash
        run: |
          cd crates/node
          # Update the CLI dependency to latest released version
          sed -i.bak 's/sublime_cli_tools = { version = "[^"]*"/sublime_cli_tools = { version = "${{ needs.prepare.outputs.cli_version }}"/' Cargo.toml
          rm -f Cargo.toml.bak
          cat Cargo.toml | grep sublime_cli_tools

      - name: Build native module
        run: ${{ matrix.settings.build }}
        working-directory: packages/workspace-tools
        shell: bash

      # Upload ONLY the .node binary file - napi artifacts expects this structure
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/workspace-tools/src/workspace-tools.*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-node

      # Download all binary artifacts to artifacts/ directory
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/workspace-tools/artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts structure ==="
          find artifacts -type f -name "*.node" | head -20
          echo "=== Full structure ==="
          ls -laR artifacts/ || true
        working-directory: packages/workspace-tools

      # Move binaries to npm/*/ directories using napi artifacts
      - name: Move artifacts to npm directories
        run: pnpm artifacts
        working-directory: packages/workspace-tools

      - name: List npm packages
        run: |
          echo "=== npm packages after artifacts ==="
          for dir in npm/*/; do
            echo "--- $dir ---"
            ls -la "$dir"
          done
        working-directory: packages/workspace-tools

      # Now compile TypeScript - this runs ONCE with all binaries in place
      # The build:node script will generate dist/ with ESM/CJS/types
      - name: Compile TypeScript
        run: pnpm build:node
        working-directory: packages/workspace-tools
        env:
          RELEASING_CI: 'true'

      - name: Verify dist structure
        run: |
          echo "=== dist/ structure ==="
          ls -laR dist/
          echo "=== dist/package.json ==="
          cat dist/package.json || echo "No dist/package.json"
        working-directory: packages/workspace-tools

      # Prepare for publishing - this updates versions in npm/**/package.json
      - name: Prepare for publish
        run: pnpm prepublishOnly
        working-directory: packages/workspace-tools

      - name: List final packages
        run: |
          echo "=== Main package ==="
          cat package.json | head -30
          echo ""
          echo "=== npm packages versions ==="
          for dir in npm/*/; do
            echo "--- $dir ---"
            cat "$dir/package.json" | grep -E '"(name|version)"' | head -2
          done
        working-directory: packages/workspace-tools
        shell: bash

      # Publish platform-specific packages first (npm/*/)
      - name: Publish platform packages (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run - would publish platform packages:"
          for dir in npm/*/; do
            echo "--- $dir ---"
            npm publish "$dir" --access public --dry-run
          done
        working-directory: packages/workspace-tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish platform packages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir..."
            npm publish "$dir" --access public || echo "Failed to publish $dir (may already exist)"
          done
        working-directory: packages/workspace-tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish main package from dist/ (which has its own package.json with correct paths)
      - name: Publish main package (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run - would publish main package from dist/:"
          npm publish dist/ --access public --dry-run
        working-directory: packages/workspace-tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "Publishing main package from dist/..."
          npm publish dist/ --access public
        working-directory: packages/workspace-tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
