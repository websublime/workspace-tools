# Workflow for validating Node.js bindings changes in pull requests.
#
# This workflow is separate from the main pull-request workflow because:
# 1. The node crate (sublime_node_tools) uses cdylib which is not supported on musl targets
# 2. The node crate is excluded from the Cargo workspace to avoid cargo-dist failures
# 3. Node bindings have specific version dependencies on workspace crates
#
# This workflow validates both the Rust code in crates/node and the Node.js package,
# including building and testing the native bindings on all supported platforms.
#
# Testing strategy:
# - macOS and Windows: Native testing on actual runners
# - Linux (including ARM): Testing via QEMU emulation in Docker containers
#
# Trigger: Pull requests that modify packages/workspace-tools or crates/node

name: Pull Request Node.js Bindings

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'packages/workspace-tools/**'
      - 'crates/node/**'
      - '.github/workflows/pull-request-node.yml'
      - '.github/workflows/release-node.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  # Rust checks for the node crate (crates/node)
  cargo-node-checks:
    name: Rust Checks (Node Crate)
    strategy:
      matrix:
        target: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt
          cache-key: node-crate-debug

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Set up Git
        uses: ./.github/actions/setup-git
        with:
          user: committer

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: crates/node

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/node

      - name: Run Tests
        run: cargo test --lib -- --test-threads=1 --nocapture
        working-directory: crates/node

      - name: Check documentation
        run: cargo doc --no-deps
        working-directory: crates/node
        env:
          RUSTDOCFLAGS: -D warnings

  # Build native bindings for all targets
  build:
    name: Build - ${{ matrix.settings.target }}
    needs: cargo-node-checks
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build-binding --target aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: pnpm build-binding --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build-binding --target x86_64-unknown-linux-gnu -x
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm build-binding --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build-binding --target aarch64-unknown-linux-gnu -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: pnpm build-binding --target aarch64-unknown-linux-musl -x
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build-binding --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build-binding --target aarch64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      # Ensure target is installed explicitly for cross-compilation
      - name: Install Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Install ziglang (Linux cross-compile)
        if: ${{ runner.os == 'Linux' }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build native module
        run: ${{ matrix.settings.build }}
        working-directory: packages/workspace-tools
        shell: bash

      - name: List artifacts
        run: ls -la packages/workspace-tools/src
        shell: bash

      - name: Verify native module exists
        run: |
          if ls src/*.node 1> /dev/null 2>&1; then
            echo "✅ Native module built successfully"
            ls -la src/*.node
          else
            echo "❌ No .node file found!"
            exit 1
          fi
        working-directory: packages/workspace-tools
        shell: bash

      # Upload the .node binary for all targets
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/workspace-tools/src/workspace-tools.*.node
          if-no-files-found: error

  # Test bindings on macOS and Windows (native runners)
  test-macos-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
        node:
          - '22'
          - '24'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/workspace-tools/src

      - name: List downloaded artifacts
        run: ls -la packages/workspace-tools/src
        shell: bash

      - name: Set up Git
        uses: ./.github/actions/setup-git
        with:
          user: committer

      - name: Build TypeScript
        run: pnpm build:node
        working-directory: packages/workspace-tools

      - name: Run integration tests
        run: pnpm test
        working-directory: packages/workspace-tools

  # Test bindings on Linux targets using QEMU emulation
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
        node:
          - '22'
          - '24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}

      - name: Determine Docker platform and image
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          node -e "
            if ('${{ matrix.target }}'.endsWith('-musl')) {
              console.log('IMAGE=node:${{ matrix.node }}-alpine')
            } else {
              console.log('IMAGE=node:${{ matrix.node }}-slim')
            }
          " >> $GITHUB_OUTPUT
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/workspace-tools/src

      - name: List downloaded artifacts
        run: ls -la packages/workspace-tools/src

      - name: Build TypeScript
        run: pnpm build:node
        working-directory: packages/workspace-tools

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Enable QEMU for multi-arch
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Test bindings in Docker
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ steps.docker.outputs.IMAGE }}
          options: |
            -v ${{ steps.docker.outputs.PNPM_STORE_PATH }}:${{ steps.docker.outputs.PNPM_STORE_PATH }}
            -v ${{ github.workspace }}:${{ github.workspace }}
            -w ${{ github.workspace }}/packages/workspace-tools
            --platform ${{ steps.docker.outputs.PLATFORM }}
          run: |
            echo "Testing on ${{ matrix.target }} with Node.js ${{ matrix.node }}"
            echo "Platform: ${{ steps.docker.outputs.PLATFORM }}"
            echo "Image: ${{ steps.docker.outputs.IMAGE }}"
            echo ""
            echo "=== Testing getVersion() ==="
            node -e "const { getVersion } = require('./dist/cjs/index.cjs'); console.log('Version:', getVersion());"
            echo ""
            echo "=== Testing status() with validation error ==="
            node -e "
              const { status } = require('./dist/cjs/index.cjs');
              status({ root: '/nonexistent/path' }).then(result => {
                if (!result.success && result.error && result.error.code) {
                  console.log('Error handling works:', result.error.code, '-', result.error.message);
                } else {
                  console.error('Unexpected result:', JSON.stringify(result));
                  process.exit(1);
                }
              });
            "
            echo ""
            echo "=== Testing status() with valid workspace ==="
            node -e "
              const { status } = require('./dist/cjs/index.cjs');
              status({ root: '${{ github.workspace }}' }).then(result => {
                if (result.success && result.data) {
                  console.log('Repository:', result.data.repository.kind);
                  console.log('Package Manager:', result.data.packageManager.name);
                  console.log('Packages:', result.data.packages.length);
                } else {
                  console.error('Status failed:', JSON.stringify(result.error));
                  process.exit(1);
                }
              });
            "
            echo ""
            echo "✅ All binding tests passed!"

  # Lint Node.js package
  lint-node:
    name: Lint Node.js Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Check TypeScript types
        run: pnpm tsc --noEmit
        working-directory: packages/workspace-tools
        continue-on-error: true
