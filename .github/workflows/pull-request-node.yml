# Workflow for validating Node.js bindings changes in pull requests.
#
# This workflow is separate from the main pull-request workflow because:
# 1. The node crate (sublime_node_tools) uses cdylib which is not supported on musl targets
# 2. The node crate is excluded from the Cargo workspace to avoid cargo-dist failures
# 3. Node bindings have specific version dependencies on workspace crates
#
# This workflow validates both the Rust code in crates/node and the Node.js package,
# including building and testing the native bindings.
#
# Trigger: Pull requests that modify packages/workspace-tools or crates/node

name: Pull Request Node.js Bindings

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'packages/workspace-tools/**'
      - 'crates/node/**'
      - '.github/workflows/pull-request-node.yml'
      - '.github/workflows/release-node.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  # Rust checks for the node crate (crates/node)
  cargo-node-checks:
    name: Rust Checks (Node Crate)
    strategy:
      matrix:
        target: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt
          cache-key: node-crate-debug

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Set up Git
        uses: ./.github/actions/setup-git
        with:
          user: committer

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: crates/node

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/node

      - name: Run Tests
        run: cargo test --lib -- --test-threads=1 --nocapture
        working-directory: crates/node

      - name: Check documentation
        run: cargo doc --no-deps
        working-directory: crates/node
        env:
          RUSTDOCFLAGS: -D warnings

  # Build native bindings for testing
  build:
    name: Build - ${{ matrix.settings.target }}
    needs: cargo-node-checks
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build-binding --target aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: pnpm build-binding --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build-binding --target x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build-binding --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: node-build-${{ matrix.settings.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Build native module
        run: ${{ matrix.settings.build }}
        working-directory: packages/workspace-tools
        env:
          CARGO_BUILD_TARGET: ${{ matrix.settings.target }}

      - name: List artifacts
        run: ls -la packages/workspace-tools/src
        shell: bash

      - name: Compile typescript
        run: pnpm build:node
        working-directory: packages/workspace-tools
        shell: bash

      - name: Test binding
        run: node -e "const { getVersion } = require('./dist/cjs/index.cjs'); console.log('Version:', getVersion());"
        working-directory: packages/workspace-tools

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/workspace-tools/dist
          if-no-files-found: error

  # Lint Node.js package
  lint-node:
    name: Lint Node.js Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Check TypeScript types
        run: pnpm tsc --noEmit
        working-directory: packages/workspace-tools
        continue-on-error: true
