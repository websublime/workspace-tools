# Release Crates Workflow
#
# This workflow manages automated releases of Rust crates to crates.io using release-plz.
#
# What: Automates versioning, changelog generation, and crates.io publishing
# How: Uses release-plz to detect changes, bump versions, and publish crates
# Why: Ensures consistent, automated releases with proper changelogs
#
# Triggers:
# - On push to main: Creates release PRs and publishes approved releases
#
# Configuration: See release-plz.toml in the repository root

name: Release Crates (crates.io)

on:
  push:
    branches:
      - main

jobs:
  # Release unpublished packages to crates.io
  release-plz-release:
    name: Release crates
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'websublime' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Run release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Create a PR with new versions and changelogs, preparing the next release
  release-plz-pr:
    name: Create release pull request
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'websublime' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
