# Pull Request Workflow
#
# This workflow validates all pull requests targeting the main branch.
# All jobs must pass before a PR can be merged (enforced via GitHub status checks).
#
# What: Validates Rust code quality, tests, and security
# How: Runs cargo checks on multiple platforms (Linux, macOS, Windows)
# Why: Ensures code quality and cross-platform compatibility before merging

name: Pull Request

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
  push:
    branches:
      - "renovate/**" # For renovate bot "automerge": true
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'main' }}

jobs:
  # Detect which files changed to optimize CI runs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust-changes: ${{ (steps.filter.outputs.rust-changes == 'true') || (github.ref_name == 'main') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust-changes:
              - '.github/workflows/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'release-plz.toml'
              - '.gitattributes'

      - name: Show outputs
        run: |
          echo "Rust changes: ${{ (steps.filter.outputs.rust-changes == 'true') || (github.ref_name == 'main') }}"

  # Run Rust checks and tests on all platforms
  cargo-test:
    name: Cargo Test (${{ matrix.target }})
    needs: changes
    if: ${{ needs.changes.outputs.rust-changes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy rustfmt
          cache-key: debug-build

      - name: Set up Git
        uses: ./.github/actions/setup-git
        with:
          user: committer

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: Run tests
        run: cargo test --workspace -- --test-threads=1 --nocapture

      - name: Check documentation
        run: cargo doc --no-deps --all-features --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  # Security audit for dependencies
  security-audit:
    name: Security Audit
    needs: changes
    if: ${{ needs.changes.outputs.rust-changes == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
