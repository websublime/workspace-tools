[package]
name = "sublime_node_tools"
description = "Node.js bindings for Sublime Workspace CLI Tools via napi-rs"
documentation = "https://docs.rs/sublime_node_tools"
readme = "README.md"
keywords = ["napi-rs", "nodejs", "workspace", "tools", "bindings"]
categories = ["development-tools", "api-bindings"]

# Standalone crate configuration - not part of workspace due to cdylib
# incompatibility with musl targets. See root Cargo.toml for details.
edition = "2024"
license = "MIT"
repository = "https://github.com/websublime/workspace-tools"
authors = ["WebSublime"]
rust-version = "1.90.0"
version = "0.0.4"

# This crate is not published to crates.io. It uses cdylib which is built
# and distributed via napi-rs to npm instead. Additionally, cdylib is not
# supported on all targets (e.g., x86_64-unknown-linux-musl).
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Exclude from cargo-dist builds - this crate uses cdylib which is not supported
# on all targets (e.g., x86_64-unknown-linux-musl). Node.js bindings are built
# separately via napi-rs in the packages/workspace-tools directory.
[package.metadata.dist]
dist = false

[lib]
crate-type = ["cdylib"]
doctest = false

[lints.clippy]
# Guidelines
dbg_macro = "deny"
print_stdout = "deny"
clone_on_ref_ptr = "deny"
empty_drop = "deny"
exit = "deny"
filetype_is_file = "deny"
get_unwrap = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
unnecessary_safety_comment = "deny"
pedantic = { level = "deny", priority = -1 }
module_inception = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_const_for_fn = "allow"
needless_for_each = "allow"
new_without_default = "allow"
missing_panics_doc = "allow"
inconsistent_struct_constructor = "allow"
single_match = "allow"
single_match_else = "allow"

[dependencies]
# NAPI - Node.js bindings
napi = { version = "3.6.0", features = ["async", "tokio_rt", "napi9"] }
napi-derive = "3.4.0"

# Workspace crates - using path dependencies
sublime_cli_tools = { version = "0.0.26", path = "../cli" }
sublime_git_tools = { version = "0.0.14", path = "../git" }
sublime_pkg_tools = { version = "0.0.18", path = "../pkg" }
sublime_standard_tools = { version = "0.0.14", path = "../standard" }

# Serialization
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

# Async runtime
tokio = { version = "1.38.0", features = ["full", "time"] }

# Logging and diagnostics
tracing = "0.1"

# Error handling
thiserror = "1.0.64"

# Memory allocator - mimalloc for better performance
# Non-Linux/FreeBSD/WASM targets use default mimalloc
[target.'cfg(all(not(target_os = "linux"), not(target_os = "freebsd"), not(target_family = "wasm")))'.dependencies]
mimalloc = "0.1"

# Linux/FreeBSD targets need local_dynamic_tls feature for cross-compilation
# This is required for aarch64-unknown-linux-gnu and other cross-compiled targets
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

[build-dependencies]
napi-build = "2.3.1"

[dev-dependencies]
tempfile = "3.8.1"
tokio = { version = "1.38.0", features = ["full", "test-util", "macros"] }
